<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бронь комнаты ISMA</title>
  <meta name="description" content="Календарь бронирования комнаты для мероприятий ЖК ISMA">
  <meta name="theme-color" content="#206a75">
  <script src="theme.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/" aria-label="ISMA"><span class="logo-mark" aria-hidden="true"></span><span class="logo-text">ISMA</span></a>
      <div class="controls">
        <div class="seg" role="group" data-i18n-aria="language">
          <button data-lang="ru">RU</button><button data-lang="kk">KZ</button><button data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="theme-toggle" data-i18n-aria="themeToggle">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>

    <header class="hero">
      <p class="complex" data-i18n="complex"></p>
      <h1 data-i18n="title"></h1>
      <p data-i18n="hint"></p>
      <ul class="rules">
        <li data-i18n="rule1"></li>
        <li data-i18n="rule2"></li>
        <li data-i18n="rule3"></li>
      </ul>
    </header>

    <section class="card">
      <div class="month-nav">
        <button class="icon-btn" id="prev" data-i18n-aria="prevMonth">‹</button>
        <h2 id="month-title" aria-live="polite"></h2>
        <button class="icon-btn" id="next" data-i18n-aria="nextMonth">›</button>
      </div>
      <div class="weekdays" id="weekdays" aria-hidden="true"></div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span class="l-free" data-i18n="legendFree"></span>
        <span class="l-taken" data-i18n="legendTaken"></span>
        <span class="l-today" data-i18n="legendToday"></span>
      </div>
    </section>

    <section class="card">
      <h3 id="list-title"></h3>
      <ul class="list" id="list"></ul>
    </section>

    <section class="card" id="rules" hidden>
      <h3 data-i18n="rulesTitle"></h3>
      <ul class="rules-list" id="rules-list"></ul>
    </section>

    <section class="card help" id="help" hidden>
      <p data-i18n="footerHelp"></p>
      <a class="wa-link" id="wa-link" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>
        <span data-i18n="contactAdmin"></span>
      </a>
    </section>
  </div>

  <dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
