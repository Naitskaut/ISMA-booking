<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Админка ISMA</title>
  <meta name="theme-color" content="#206a75">
  <script src="theme.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="logo" href="/" aria-label="ISMA"><span class="logo-mark" aria-hidden="true"></span><span class="logo-text">ISMA</span></a>
      <div class="controls">
        <div class="seg" role="group" data-i18n-aria="language">
          <button data-lang="ru">RU</button><button data-lang="kk">KZ</button><button data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="theme-toggle" data-i18n-aria="themeToggle">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>

    <header class="hero">
      <div class="head">
        <div>
          <p class="complex" data-i18n="complex"></p>
          <h1 data-i18n="adminTitle"></h1>
          <p><a href="/" data-i18n="backToCalendar"></a></p>
        </div>
        <button class="btn small" id="logout" data-i18n="logout" hidden></button>
      </div>
    </header>

    <!-- Вход -->
    <section class="card" id="login-card">
      <form id="login-form">
        <label for="password" data-i18n="passwordLabel"></label>
        <input type="password" id="password" autocomplete="current-password" required>
        <div class="error" id="login-error" hidden></div>
        <div class="actions"><button class="btn primary" type="submit" data-i18n="login"></button></div>
      </form>
    </section>

    <div id="admin" hidden>
      <div class="tabs" role="tablist">
        <button class="btn" role="tab" data-tab="bookings" aria-selected="true" data-i18n="tabBookings"></button>
        <button class="btn" role="tab" data-tab="apartments" aria-selected="false" data-i18n="tabApartments"></button>
        <button class="btn" role="tab" data-tab="settings" aria-selected="false" data-i18n="tabSettings"></button>
      </div>

      <!-- Брони -->
      <div data-panel="bookings">
        <section class="card">
          <div class="month-nav">
            <button class="icon-btn" id="prev" data-i18n-aria="prevMonth">‹</button>
            <h2 id="month-title"></h2>
            <button class="icon-btn" id="next" data-i18n-aria="nextMonth">›</button>
          </div>
          <ul class="list" id="bookings"></ul>
          <div class="actions start"><button class="btn small" id="export" type="button" data-i18n="exportBookings"></button></div>
        </section>

        <section class="card">
          <h3 data-i18n="adminBookTitle"></h3>
          <p class="hint sub-hint" data-i18n="adminBookHint"></p>
          <form id="admin-book" class="row">
            <div><label for="ab-apt" data-i18n="apartment"></label><input type="text" id="ab-apt" required></div>
            <div><label for="ab-date" data-i18n="date"></label><input type="date" id="ab-date" required></div>
            <div class="fit"><button class="btn primary" type="submit" data-i18n="bookBtn"></button></div>
          </form>
          <div class="error" id="ab-error" hidden></div>
        </section>
      </div>

      <!-- Квартиры -->
      <div data-panel="apartments" hidden>
        <section class="card">
          <h3><span data-i18n="aptCount"></span> <span id="apt-count">…</span></h3>
          <details><summary data-i18n="showList"></summary><div class="chips" id="apt-list"></div></details>
        </section>

        <section class="card">
          <h3 data-i18n="addTitle"></h3>
          <form id="add-form">
            <div class="radio" role="radiogroup">
              <label><input type="radio" name="mode" value="range" checked> <span data-i18n="modeRange"></span></label>
              <label><input type="radio" name="mode" value="list"> <span data-i18n="modeList"></span></label>
            </div>
            <div id="mode-range" class="row">
              <div><label for="r-from" data-i18n="from"></label><input type="number" id="r-from" min="1" value="1"></div>
              <div><label for="r-to" data-i18n="to"></label><input type="number" id="r-to" min="1" value="503"></div>
              <div><label for="r-prefix" data-i18n="prefix"></label><input type="text" id="r-prefix" data-i18n-ph="prefixPh"></div>
            </div>
            <p class="hint" id="range-hint" data-i18n="rangeHint"></p>
            <div id="mode-list" hidden>
              <label for="l-text" data-i18n="listLabel"></label>
              <textarea id="l-text" placeholder="1&#10;2&#10;3А"></textarea>
            </div>
            <label class="check"><input type="checkbox" id="overwrite"> <span data-i18n="overwrite"></span></label>
            <div class="error" id="add-error" hidden></div>
            <div class="actions"><button class="btn primary" type="submit" data-i18n="createCodes"></button></div>
          </form>
          <div class="result" id="add-result" hidden></div>
        </section>

        <section class="card">
          <h3 data-i18n="oneTitle"></h3>
          <p class="hint sub-hint" data-i18n="oneHint"></p>
          <form id="one-form" class="row">
            <div><label for="one-apt" data-i18n="apartment"></label><input type="text" id="one-apt" required></div>
            <div class="fit row">
              <button class="btn primary" type="submit" data-action="regenerate" data-i18n="newCode"></button>
              <button class="btn danger" type="submit" data-action="delete" data-i18n="delete"></button>
            </div>
          </form>
          <div class="error" id="one-error" hidden></div>
          <div class="result" id="one-result" hidden></div>
        </section>
      </div>

      <!-- Настройки -->
      <div data-panel="settings" hidden>
        <section class="card">
          <form id="settings-form">
            <label for="s-wa" data-i18n="waLabel"></label>
            <input type="text" id="s-wa" inputmode="tel" autocomplete="off" placeholder="+7 701 123 45 67">
            <p class="hint" data-i18n="waHint"></p>

            <label for="s-hours" data-i18n="cancelHoursLabel"></label>
            <input type="number" id="s-hours" min="0" max="168" step="1" class="short">
            <p class="hint" data-i18n="cancelHoursHint"></p>

            <label for="s-rules-ru" data-i18n="rulesRu"></label>
            <textarea id="s-rules-ru"></textarea>
            <label for="s-rules-kk" data-i18n="rulesKk"></label>
            <textarea id="s-rules-kk"></textarea>
            <label for="s-rules-en" data-i18n="rulesEn"></label>
            <textarea id="s-rules-en"></textarea>
            <p class="hint" data-i18n="rulesHint"></p>

            <div class="error" id="settings-error" hidden></div>
            <div class="actions start"><button class="btn primary" type="submit" data-i18n="save"></button></div>
          </form>
        </section>
      </div>
    </div>
  </div>

  <div id="print-area"></div>

  <script type="module" src="admin.js"></script>
</body>
</html>
